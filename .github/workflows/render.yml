name: Boss Cloud 3D Render Engine

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'प्रोजेक्ट का नाम (Folder in projects/)'
        required: true
        default: '01_isro_rocket'
      engine:
        description: 'रेंडर इंजन (BLENDER_WORKBENCH, BLENDER_EEVEE, CYCLES)'
        required: true
        type: choice
        options:
          - 'BLENDER_WORKBENCH'
          - 'BLENDER_EEVEE'
          - 'CYCLES'
        default: 'BLENDER_WORKBENCH'
      start_frame:
        description: 'Start Frame'
        required: true
        default: '1'
      end_frame:
        description: 'End Frame'
        required: true
        default: '900'

permissions:
  contents: write

jobs:
  cloud-render:
    name: "Render ${{ inputs.project }} in Cloud"
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up System Tools (Blender, FFmpeg & OpenGL Headless)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender ffmpeg xvfb libegl1 libgl1 libgl1-mesa-dri libglu1-mesa

      - name: Verify Blender Version
        run: |
          blender --version
          ffmpeg -version | head -n 1

      - name: Run Cloud 3D Render
        run: |
          mkdir -p output
          python3 engine/render_in_cloud.py \
            --project "${{ inputs.project }}" \
            --engine "${{ inputs.engine }}" \
            --start "${{ inputs.start_frame }}" \
            --end "${{ inputs.end_frame }}"

      - name: Publish Direct MP4 to Releases (1-Click Download)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "render-${{ github.run_number }}"
          name: "Boss Render: ${{ inputs.project }} (Run #${{ github.run_number }})"
          body: "Direct 1-click MP4 download link (No login required, plays everywhere)."
          files: output/*.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Boss_${{ inputs.project }}_Render"
          path: output/*.mp4
          retention-days: 14
